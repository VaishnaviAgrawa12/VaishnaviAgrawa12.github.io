<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'JetBrains Mono',ui-monospace,monospace">
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C0C0E"/>
      <stop offset="0.55" stop-color="#151210"/>
      <stop offset="1" stop-color="#0C0C0E"/>
    </linearGradient>
    <radialGradient id="glow3" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#C9A876" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#C9A876" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9BC8E" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#D9BC8E" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#D9BC8E" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft3" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="lit" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1B1B1D" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gm3"><rect width="800" height="500" fill="url(#fade3)"/></mask>
  </defs>

  <rect width="800" height="500" fill="url(#sky3)"/>
  <rect width="800" height="500" fill="url(#grid3)" mask="url(#gm3)"/>
  <rect width="800" height="500" fill="url(#glow3)"/>
  <g filter="url(#soft3)" opacity="0.7">
    <rect x="300" y="-60" width="110" height="620" fill="url(#beam3)" transform="rotate(9 355 250)"/>
  </g>

  <!-- vitals trace -->
  <g>
    <path d="M60 210 H190 L206 210 L216 160 L228 262 L240 196 L252 210 H392 L406 210 L416 174 L428 246 L440 202 L452 210 H742"
          fill="none" stroke="#C9A876" stroke-width="2.5" stroke-linejoin="round"/>
    <g filter="url(#lit)" opacity="0.85">
      <path d="M196 210 L216 160 L228 262 L240 196 L252 210" fill="none" stroke="#D9BC8E" stroke-width="4"/>
    </g>
    <circle cx="452" cy="210" r="6" fill="#D9BC8E"/>
    <circle cx="452" cy="210" r="13" fill="none" stroke="#D9BC8E" stroke-opacity="0.4"/>
  </g>

  <!-- record cards -->
  <g font-size="11" letter-spacing="2">
    <rect x="60" y="266" width="200" height="86" rx="5" fill="#141416" stroke="#242426"/>
    <path d="M60 266 h200" stroke="#C9A876" stroke-width="2"/>
    <text x="78" y="296" fill="#EDEDE8" font-size="13">PATIENT #1042</text>
    <text x="78" y="318" fill="#5E5E58">ADMITTED · 04:12</text>
    <text x="78" y="338" fill="#9A9A92">JPA · POSTGRES</text>

    <rect x="278" y="266" width="200" height="86" rx="5" fill="#141416" stroke="#242426"/>
    <path d="M278 266 h200" stroke="#3A3A3C" stroke-width="2"/>
    <text x="296" y="296" fill="#9A9A92" font-size="13">PATIENT #1043</text>
    <text x="296" y="318" fill="#5E5E58">ADMITTED · 05:48</text>
    <text x="296" y="338" fill="#5E5E58">JPA · POSTGRES</text>

    <rect x="496" y="266" width="200" height="86" rx="5" fill="#141416" stroke="#242426" opacity="0.55"/>
    <path d="M496 266 h200" stroke="#3A3A3C" stroke-width="2" opacity="0.55"/>
    <text x="514" y="296" fill="#5E5E58" font-size="13">PATIENT #1044</text>
    <text x="514" y="318" fill="#3A3A3C">ADMITTED · 06:31</text>
  </g>

  <g font-size="10" letter-spacing="2">
    <rect x="60" y="112" width="86" height="24" rx="12" fill="none" stroke="#C9A876"/>
    <text x="103" y="128" fill="#C9A876" text-anchor="middle">CRUD</text>
    <rect x="156" y="112" width="86" height="24" rx="12" fill="none" stroke="#3A3A3C"/>
    <text x="199" y="128" fill="#9A9A92" text-anchor="middle">JUNIT</text>
  </g>

  <text x="60" y="404" fill="#EDEDE8" font-family="'Archivo Narrow',Archivo,sans-serif" font-size="38" font-weight="700" letter-spacing="-1">PATIENT MANAGEMENT</text>
  <path d="M60 424 H352" stroke="#C9A876" stroke-width="2"/>
  <text x="60" y="452" fill="#9A9A92" font-size="12" letter-spacing="3">CRUD · JPA · JUNIT</text>
  <text x="742" y="452" fill="#5E5E58" font-size="12" text-anchor="end" letter-spacing="3">2026</text>

  <rect x="0" y="0" width="800" height="500" fill="none" stroke="#242426"/>
</svg>
