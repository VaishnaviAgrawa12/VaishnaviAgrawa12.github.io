<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'JetBrains Mono',ui-monospace,monospace">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C0C0E"/>
      <stop offset="0.55" stop-color="#101416"/>
      <stop offset="1" stop-color="#0C0C0E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.62" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#4A9188" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#4A9188" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5FB3A7" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#5FB3A7" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#5FB3A7" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="tight" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1B1B1D" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridmask"><rect width="800" height="500" fill="url(#fade)"/></mask>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <rect width="800" height="500" fill="url(#grid)" mask="url(#gridmask)"/>
  <rect width="800" height="500" fill="url(#glow)"/>
  <g filter="url(#soft)" opacity="0.75">
    <rect x="150" y="-60" width="70" height="620" fill="url(#beam)" transform="rotate(13 185 250)"/>
    <rect x="520" y="-60" width="120" height="620" fill="url(#beam)" transform="rotate(13 580 250)"/>
  </g>

  <!-- inputs -->
  <g opacity="0.9">
    <rect x="58" y="150" width="150" height="46" rx="3" fill="none" stroke="#5E5E58" stroke-width="1.5"/>
    <text x="133" y="178" fill="#9A9A92" font-size="14" text-anchor="middle" letter-spacing="2">RULES</text>
    <rect x="58" y="262" width="150" height="46" rx="3" fill="none" stroke="#4A9188" stroke-width="1.5"/>
    <text x="133" y="290" fill="#5FB3A7" font-size="14" text-anchor="middle" letter-spacing="2">LLM</text>
    <text x="133" y="330" fill="#5E5E58" font-size="10" text-anchor="middle" letter-spacing="2">FALLBACK</text>
  </g>

  <!-- flow -->
  <g fill="none" stroke-width="1.5">
    <path d="M208 173 H300 V222 H360" stroke="#4A9188" stroke-dasharray="7 6"/>
    <path d="M208 285 H300 V240 H360" stroke="#5E5E58" stroke-dasharray="7 6"/>
  </g>
  <circle cx="300" cy="222" r="4" fill="#5FB3A7"/>

  <!-- verdict panel -->
  <g>
    <rect x="360" y="120" width="330" height="220" rx="6" fill="#141416" stroke="#242426"/>
    <rect x="360" y="120" width="330" height="42" rx="6" fill="#191919"/>
    <path d="M360 162 H690" stroke="#242426"/>
    <circle cx="382" cy="141" r="4.5" fill="#4A9188"/>
    <circle cx="398" cy="141" r="4.5" fill="#6BA8FF"/>
    <circle cx="414" cy="141" r="4.5" fill="#D4F04A"/>
    <text x="670" y="146" fill="#5E5E58" font-size="10" text-anchor="end" letter-spacing="2">DECISION</text>

    <text x="390" y="202" fill="#6BA8FF" font-size="13">"verdict"</text>
    <text x="480" y="202" fill="#5E5E58" font-size="13">:</text>
    <text x="498" y="202" fill="#D4F04A" font-size="13" font-weight="700">"SKIP"</text>

    <text x="390" y="234" fill="#6BA8FF" font-size="13">"score"</text>
    <text x="480" y="234" fill="#5E5E58" font-size="13">:</text>
    <text x="498" y="234" fill="#9B7BF5" font-size="13">9</text>

    <text x="390" y="266" fill="#6BA8FF" font-size="13">"timeline"</text>
    <text x="480" y="266" fill="#5E5E58" font-size="13">:</text>
    <text x="498" y="266" fill="#C9A876" font-size="13">"+6 months"</text>

    <rect x="390" y="292" width="270" height="6" rx="3" fill="#242426"/>
    <rect x="390" y="292" width="26" height="6" rx="3" fill="#D4F04A"/>
  </g>

  <!-- title block -->
  <text x="58" y="404" fill="#EDEDE8" font-family="'Archivo Narrow',Archivo,sans-serif" font-size="38" font-weight="700" letter-spacing="-1">PURCHASE DECISION API</text>
  <path d="M58 424 H360" stroke="#4A9188" stroke-width="2"/>
  <text x="58" y="452" fill="#9A9A92" font-size="12" letter-spacing="3">SPRING BOOT · JWT · LLM · CI/CD</text>
  <g>
    <rect x="612" y="428" width="130" height="26" rx="13" fill="none" stroke="#D4F04A"/>
    <circle cx="632" cy="441" r="4" fill="#D4F04A"/>
    <text x="646" y="446" fill="#D4F04A" font-size="11" letter-spacing="2">LIVE IN PROD</text>
  </g>

  <rect x="0" y="0" width="800" height="500" fill="none" stroke="#242426"/>
</svg>
